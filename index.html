  function sair(){lock=Date.now()+600;mae=false;window.__mae=false;nomes(CONFIG.pessoa.nome);window.__fotos(CONFIG.fotos);CONFIG.play.tocando=M.fraseNormal;try{window.__balaoMae(false);}catch(x){}try{window.__maeOn(false);}catch(x){}}
  document.addEventListener('click',function(e){
    if(!e.target.closest||!e.target.closest(alvo))return;
    if(Date.now()<lock)return;
    if(mae){sair();return;}
    clearTimeout(t);n++;

  });
